name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  api:
    name: API (lint, type-check, test)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bi_app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: bi_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bi_app -d bi_copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Matches the docker-compose.yml `db` service and the bi_readonly role
      # the Phase 1 migration creates -- lets the live-database integration
      # test (normally self-skipping) actually run in CI.
      DATABASE_URL: postgresql+asyncpg://bi_app:changeme@localhost:5432/bi_copilot
      WAREHOUSE_URL: postgresql+asyncpg://bi_readonly:changeme@localhost:5432/bi_copilot
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: mypy (app)
        run: mypy app

      - name: mypy (tests)
        run: mypy tests

      - name: pytest
        run: pytest -q

  web:
    name: Web (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Prettier
        run: pnpm run format

      - name: Type-check
        run: pnpm run typecheck

      - name: Vitest
        run: pnpm run test

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm run build
