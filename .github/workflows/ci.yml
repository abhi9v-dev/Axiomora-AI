name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  api:
    name: API (lint, type-check, test)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bi_app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: bi_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bi_app -d bi_copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Matches the docker-compose.yml `db` service and the bi_readonly role
      # the Phase 1 migration creates -- lets the live-database integration
      # test (normally self-skipping) actually run in CI.
      DATABASE_URL: postgresql+asyncpg://bi_app:changeme@localhost:5432/bi_copilot
      WAREHOUSE_URL: postgresql+asyncpg://bi_readonly:changeme@localhost:5432/bi_copilot
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: mypy (app)
        run: mypy app

      - name: mypy (tests)
        run: mypy tests

      - name: pytest
        run: pytest -q

  web:
    name: Web (lint, type-check, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      # pnpm-lock.yaml lives at the workspace root (pnpm-workspace.yaml
      # covers apps/*, packages/* and tests/e2e -- see packages/contracts,
      # consumed by apps/web) -- install runs from the root; every
      # subsequent step still runs inside apps/web, where install already
      # linked apps/web/node_modules (and packages/contracts) for it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: apps/web
        run: pnpm run lint

      - name: Prettier
        working-directory: apps/web
        run: pnpm run format

      - name: Type-check
        working-directory: apps/web
        run: pnpm run typecheck

      - name: Vitest
        working-directory: apps/web
        run: pnpm run test

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm run build

  e2e:
    name: E2E (Playwright, full Ask flow)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bi_app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: bi_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bi_app -d bi_copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://bi_app:changeme@localhost:5432/bi_copilot
      WAREHOUSE_URL: postgresql+asyncpg://bi_readonly:changeme@localhost:5432/bi_copilot
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install web dependencies (pnpm workspace root)
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Migrate, seed and ingest the catalog
        run: |
          alembic upgrade head
          python -m app.db.seed
          python -m app.catalog.ingest
        working-directory: apps/api

      - name: Start the API server
        working-directory: apps/api
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          disown

      - name: Build and start the web app
        working-directory: apps/web
        run: |
          pnpm run build
          nohup pnpm run start -- --port 3000 > /tmp/web.log 2>&1 &
          disown

      - name: Wait for both servers to be ready
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/ready && break; sleep 2; done
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 2; done

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: pnpm run test

      - name: Upload API/web logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            /tmp/api.log
            /tmp/web.log

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
