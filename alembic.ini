[alembic]
# Resolved relative to this file's own directory, so `alembic` works
# regardless of the caller's current working directory.
script_location = %(here)s/migrations

# sqlalchemy.url is intentionally omitted -- migrations/env.py sets it at
# runtime from Settings.DATABASE_URL (apps/api/app/config.py) so no
# connection string is ever committed to source control.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
